packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  esbuild: false
  sharp: false
minimumReleaseAgeExclude:
  - '@tuwaio/*'
  - framer-motion@14.0.0
  - motion-dom@14.0.0
  - motion-utils@14.0.0
  - '@types/node@26.2.0'
  - eslint@10.8.1
  - '@next/env@16.3.1 || 16.3.7'
  - '@next/swc-darwin-arm64@16.3.1 || 16.3.7'
  - '@next/swc-darwin-x64@16.3.1 || 16.3.7'
  - '@next/swc-linux-arm64-gnu@16.3.1 || 16.3.7'
  - '@next/swc-linux-arm64-musl@16.3.1 || 16.3.7'
  - '@next/swc-linux-x64-gnu@16.3.1 || 16.3.7'
  - '@next/swc-linux-x64-musl@16.3.1 || 16.3.7'
  - '@next/swc-win32-arm64-msvc@16.3.1 || 16.3.7'
  - '@next/swc-win32-x64-msvc@16.3.1 || 16.3.7'
  - next@16.3.1 || 16.3.7
  - viem@2.55.16 || 2.57.1
overrides:
  # nextra-theme-docs 4.6.1 validates its Layout props with zod; with zod 4.4 and newer the validation rejects them
  # ("expected nonoptional ... at children"). Keep 4.3 for Nextra.
  nextra>zod: 4.3.6
  nextra-theme-docs>zod: 4.3.6
